
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Discount</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        h1 {
            color: #174a6e;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: #174a6e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #246b99;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #174a6e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Member Discount</h1>
        <p>Calculate your total after discount.</p>

        <label for="cartTotal">Cart Total ($)</label>
        <input type="number" id="cartTotal"
               placeholder="Enter cart total" min="0" step="0.01">

        <label>
            <input type="checkbox" id="isMember">
            I am a member
        </label>

        <br><br>
        <button onclick="calculateTotal()">Calculate Total</button>

        <p id="result"></p>
    </div>

    <script>
        // Calculate discount based on membership
        function getDiscount(total, isMember) {
            if (isMember) {
                return total * 0.10;
            } else {
                return 0;
            }
        }

        // Display the final price
        function calculateTotal() {
            const cartInput = document.getElementById("cartTotal");
            const isMember = document.getElementById("isMember").checked;
            const result = document.getElementById("result");

            if (cartInput.value.trim() === "" || Number(cartInput.value) < 0) {
                result.textContent = "Please enter a valid cart total.";
                return;
            }

            const total = Number(cartInput.value);
            const discount = getDiscount(total, isMember);
            const finalTotal = total - discount;

            result.textContent = "Discount: $" + discount.toFixed(2) +
                " | Final Total: $" + finalTotal.toFixed(2);
        }
    </script>
</body>
</html>
