<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Something Fun</title>
</head>
<body>
  <h1>Fetch Something Fun</h1>
  <p>Press the button to fetch a random dog photo from the Dog CEO API.</p>
  <button id="fetchBtn">Get a Dog</button>
  <p id="status"></p>
  <img id="dog" alt="A random dog" style="max-width: 300px; display: none;">

  <script>
    const button = document.querySelector('#fetchBtn');
    const statusEl = document.querySelector('#status');
    const dogImg = document.querySelector('#dog');

    button.addEventListener('click', async () => {
      statusEl.textContent = 'Loading...';
      button.disabled = true;
      try {
        const response = await fetch('https://dog.ceo/api/breeds/image/random');
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const data = await response.json();
        // The API returns { message: "<image URL>", status: "success" }.
        // The field this page reads is message.
        dogImg.src = data.message;
        dogImg.style.display = 'block';
        statusEl.textContent = data.message;
      } catch (error) {
        statusEl.textContent = 'Could not fetch a dog: ' + error.message;
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
