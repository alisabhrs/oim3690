<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>
  <main class="todo-app">
    <h1>To-Do List</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="todo-empty" class="empty-message">No tasks yet. Add one above!</p>
    <div class="todo-footer">
      <span id="todo-count">0 tasks left</span>
      <button id="todo-clear-completed" type="button">Clear completed</button>
    </div>
  </main>
  <script src="js/todo.js"></script>
</body>
</html>
