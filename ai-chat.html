<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask AI</title>
  <style>
    /* Dalmatian: white coat, black spots, red collar. */
    :root {
      --bg: #fbfaf7;
      --spot: #111111;
      --panel: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --accent: #111111;
      --accent-ink: #ffffff;
      --bot: #ffffff;
      --border: #111111;
      --collar: #d62828;
      --error: #d62828;
    }

    /* At night the coat flips: black with white spots. */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --spot: #f2f2f2;
        --panel: #1c1c1c;
        --ink: #f2f2f2;
        --muted: #a0a0a0;
        --accent: #f2f2f2;
        --accent-ink: #121212;
        --bot: #1c1c1c;
        --border: #f2f2f2;
        --collar: #ff5a5a;
        --error: #ff8a8a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      /* Uneven spots of different sizes, repeated across the page. */
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 22px 16px at 40px 60px, var(--spot) 98%, transparent 100%),
        radial-gradient(ellipse 12px 14px at 150px 30px, var(--spot) 98%, transparent 100%),
        radial-gradient(ellipse 30px 22px at 210px 150px, var(--spot) 98%, transparent 100%),
        radial-gradient(ellipse 10px 8px at 90px 200px, var(--spot) 98%, transparent 100%),
        radial-gradient(ellipse 16px 20px at 20px 260px, var(--spot) 98%, transparent 100%),
        radial-gradient(ellipse 8px 9px at 260px 240px, var(--spot) 98%, transparent 100%);
      background-size: 300px 300px;
    }

    h1 {
      align-self: flex-start;
      padding: 6px 16px;
      background: var(--panel);
      border: 3px solid var(--border);
      border-radius: 999px;
      /* The red collar. */
      box-shadow: 0 6px 0 var(--collar);
    }

    .chat {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: var(--panel);
      border: 3px solid var(--border);
      border-top: 10px solid var(--collar);
      border-radius: 18px;
    }

    #messages:empty::before {
      content: "🐾 Ask a question to start the chat.";
      color: var(--muted);
      margin: auto;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--accent-ink);
      border-bottom-right-radius: 4px;
    }

    .assistant {
      align-self: flex-start;
      background: var(--bot);
      border: 2px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .thinking { color: var(--muted); font-style: italic; }
    .error { color: var(--error); }

    form {
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 52px;
      padding: 14px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 3px solid var(--border);
      border-radius: 12px;
    }

    textarea:focus {
      outline: 3px solid var(--collar);
      outline-offset: 1px;
    }

    button {
      padding: 0 20px;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: var(--collar);
      border: 3px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main class="chat">
    <h1>🐾 Ask AI</h1>
    <div id="messages"></div>
    <form id="askForm">
      <textarea id="prompt" placeholder="Ask AI anything... (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="askBtn" type="submit">Ask</button>
    </form>
  </main>

  <script>
    // This page works only on your vercel.app link. Live Server and GitHub Pages
    // cannot run the function in api/ask.js, so there the Ask button fails.

    // Sends your prompt to your own function at /api/ask. The function adds the
    // key and calls the model, so no key appears anywhere on this page.
    async function askAI(prompt) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      const data = await response.json();
      // A model that reasons first puts a reasoning item ahead of the answer,
      // so find the item of type message, then read its text.
      const message = data.output.find(item => item.type === 'message');
      return message.content[0].text;
    }

    const messagesEl = document.querySelector('#messages');
    const promptEl = document.querySelector('#prompt');
    const askBtn = document.querySelector('#askBtn');

    // Adds one message bubble to the bottom of the chat and scrolls to it.
    function addMessage(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `msg ${role}`;
      // textContent shows the text as plain text. innerHTML would run any
      // HTML the model wrote.
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    document.querySelector('#askForm').addEventListener('submit', async (event) => {
      // A form reloads the page on submit unless you stop it.
      event.preventDefault();
      const prompt = promptEl.value.trim();
      // Enter can still submit while the button is off, so check it here too.
      if (!prompt || askBtn.disabled) return;

      addMessage('user', prompt);
      promptEl.value = '';
      // Turn the button off until the answer arrives, so a second click
      // cannot send, and pay for, a second request.
      askBtn.disabled = true;
      // A call takes a few seconds, so show something while you wait.
      const reply = addMessage('assistant thinking', 'Thinking...');
      try {
        reply.textContent = await askAI(prompt);
        reply.className = 'msg assistant';
      } catch (error) {
        reply.textContent = 'Error: ' + error.message;
        reply.className = 'msg assistant error';
      } finally {
        // finally runs whether the call worked or failed.
        askBtn.disabled = false;
        promptEl.focus();
      }
    });

    // Enter sends the message; Shift+Enter adds a new line instead.
    promptEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.querySelector('#askForm').requestSubmit();
      }
    });
  </script>
</body>
</html>
